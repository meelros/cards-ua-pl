    />

      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --card-border: #334155;
        --text-ua: #38bdf8;
        --text-pl: #f43f5e;
        --text-muted: #94a3b8;
        --text-main: #f8fafc;
        --accent: #6366f1;
        --accent-hover: #4f46e5;
        --btn-bg: #334155;
        --btn-hover: #475569;
        --shadow:
          0 20px 25px -5px rgba(0, 0, 0, 0.3),
          0 8px 10px -6px rgba(0, 0, 0, 0.3);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      body {
        font-family:
          "Plus Jakarta Sans",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        overflow-x: hidden;
      }

      .container {
        width: 100%;
        max-width: 680px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }

      header {
        text-align: center;
        margin-bottom: 8px;
      }

      header h1 {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #38bdf8, #818cf8, #f43f5e);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 6px;
      }

      header p {
        color: var(--text-muted);
        font-size: 0.95rem;
      }

      .card {
        background-color: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 24px;
        padding: 40px 32px;
        width: 100%;
        min-height: 280px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        position: relative;
        transition:
          transform 0.2s ease,
          border-color 0.2s ease;
      }

      .card:hover {
        border-color: #475569;
      }

      .phrase-group {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 20px;
        opacity: 1;
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
      }

      .phrase-group.fade-out {
        opacity: 0;
        transform: translateY(8px);
      }

      .phrase-group.fade-in {
        opacity: 1;
        transform: translateY(0);
      }

      .lang-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }

      .lang-label {
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        padding: 4px 10px;
        border-radius: 20px;
      }

      .ua-block .lang-label {
        color: #38bdf8;
        background: rgba(56, 189, 248, 0.1);
      }

      .pl-block .lang-label {
        color: #f43f5e;
        background: rgba(244, 63, 94, 0.1);
      }

      .phrase-text {
        font-size: 1.5rem;
        font-weight: 600;
        line-height: 1.4;
        word-break: break-word;
      }

      .ua-block .phrase-text {
        color: #f8fafc;
      }

      .pl-block .phrase-text {
        color: #fb7185;
      }

      .divider {
        height: 1px;
        width: 60%;
        background: linear-gradient(
          90deg,
          transparent,
          var(--card-border),
          transparent
        );
        margin: 4px 0;
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        width: 100%;
      }

      .btn {
        background-color: var(--btn-bg);
        color: var(--text-main);
        border: 1px solid var(--card-border);
        padding: 14px 24px;
        font-size: 1rem;
        font-weight: 600;
        border-radius: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.2s ease;
        outline: none;
      }

      .btn:hover:not(:disabled) {
        background-color: var(--btn-hover);
        border-color: #64748b;
        transform: translateY(-2px);
      }

      .btn:active:not(:disabled) {
        transform: translateY(0);
      }

      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .btn-primary {
        background-color: var(--accent);
        border-color: var(--accent);
        flex-grow: 1;
        max-width: 220px;
      }

      .btn-primary:hover:not(:disabled) {
        background-color: var(--accent-hover);
        border-color: var(--accent-hover);
      }

      .counter {
        color: var(--text-muted);
        font-size: 0.9rem;
        font-weight: 500;
        min-width: 80px;
        text-align: center;
        background: rgba(255, 255, 255, 0.03);
        padding: 8px 14px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .keyboard-hint {
        display: flex;
        gap: 16px;
        color: var(--text-muted);
        font-size: 0.8rem;
        margin-top: 8px;
      }

      .key {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        padding: 2px 8px;
        border-radius: 6px;
        color: var(--text-main);
        font-family: monospace;
        font-size: 0.85rem;
      }

      @media (max-width: 500px) {
        .card {
          padding: 28px 20px;
          min-height: 240px;
        }

        .phrase-text {
          font-size: 1.25rem;
        }

        .btn {
          padding: 12px 16px;
          font-size: 0.9rem;
        }

        .keyboard-hint {
          display: none;
        }
      }
    </style>
  </head>

            <span class="key">→</span> на клавіатурі</span

      // Fisher-Yates shuffle algorithm to randomize phrases on each page load
      function shuffleArray(array) {
        const shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
      }

      let phrases = shuffleArray(rawPhrases);
      let currentIndex = 0;

      const uaTextEl = document.getElementById("uaText");
      const plTextEl = document.getElementById("plText");
      const counterEl = document.getElementById("counter");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const phraseGroup = document.getElementById("phraseGroup");

      function updateCard(index) {
        phraseGroup.classList.remove("fade-in");
        phraseGroup.classList.add("fade-out");

        setTimeout(() => {
          const current = phrases[index];
          uaTextEl.textContent = current.ua;
          plTextEl.textContent = current.pl;
          counterEl.textContent = `${index + 1} / ${phrases.length}`;

          prevBtn.disabled = index === 0;
          nextBtn.disabled = index === phrases.length - 1;

          phraseGroup.classList.remove("fade-out");
          phraseGroup.classList.add("fade-in");
        }, 150);
      }

      prevBtn.addEventListener("click", () => {
        if (currentIndex > 0) {
          currentIndex--;
          updateCard(currentIndex);
        }
      });

      nextBtn.addEventListener("click", () => {
        if (currentIndex < phrases.length - 1) {
          currentIndex++;
          updateCard(currentIndex);
        }
      });

      // Keyboard Arrow navigation
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") {
          prevBtn.click();
        } else if (e.key === "ArrowRight" || e.key === " ") {
          e.preventDefault();
          nextBtn.click();
        }
      });

      // Initial render
      updateCard(currentIndex);
    </script>
